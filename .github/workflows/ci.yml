name: CI Backend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Ejecutar tests y compilar el artefacto
        working-directory: ./backend
        run: mvn verify -Dmaven.compiler.release=17

      - name: Verificar que prod no incluya datos de prueba
        working-directory: ./backend
        run: |
          if grep -rl "db/migration/dev-data" src/main/resources/application.properties src/main/resources/application-prod.properties; then
            echo "ERROR: application.properties / application-prod.properties no deben referenciar db/migration/dev-data" >&2
            exit 1
          fi
