name: Deploy Backend

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: [self-hosted, backend-pi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar con Maven
        working-directory: ./backend
        run: mvn compile -Dmaven.compiler.release=17 -q

      - name: Actualizar código en carpeta de despliegue
        id: update_deploy_dir
        working-directory: /home/dev/proyects/uis-schedule-system-backend
        run: |
          echo "previous_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}
          git clean -fd

      - name: Detectar cambios en migraciones Flyway
        id: migrations
        working-directory: /home/dev/proyects/uis-schedule-system-backend
        run: |
          PREVIOUS_SHA="${{ steps.update_deploy_dir.outputs.previous_sha }}"
          if git diff --name-only "$PREVIOUS_SHA" "${{ github.sha }}" -- backend/src/main/resources/db/migration/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup scheduleDB antes de aplicar migraciones
        if: steps.migrations.outputs.changed == 'true'
        working-directory: /home/dev/proyects
        run: ./scripts/db-backup.sh

      - name: Rebuild y reinicio del contenedor
        working-directory: /home/dev/proyects
        run: |
          docker-compose stop backend-spring-api
          docker-compose rm -f backend-spring-api
          docker-compose build --no-cache backend-spring-api
          docker-compose up -d --no-deps backend-spring-api
