name: Deploy Backend

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: [self-hosted, backend-pi]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar con Maven
        working-directory: ./backend
        run: mvn compile -Dmaven.compiler.release=17 -q

      # Respalda siempre antes de tocar la carpeta de despliegue, para que un
      # reintento tras un fallo también deje copia.
      - name: Backup scheduleDB antes de reconstruir
        working-directory: /home/dev/proyects/uis-schedule-system-backend
        run: |
          ROOT_DIR="$(git rev-parse --show-superproject-working-tree)"
          [ -n "$ROOT_DIR" ] || ROOT_DIR="$(cd .. && pwd)"
          if [ ! -x "$ROOT_DIR/scripts/db-backup.sh" ]; then
            echo "::error::No se encontró scripts/db-backup.sh en el repo raíz; actualizar el clon raíz (git pull)."
            exit 1
          fi
          "$ROOT_DIR/scripts/db-backup.sh"

      - name: Actualizar código en carpeta de despliegue
        working-directory: /home/dev/proyects/uis-schedule-system-backend
        run: |
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}
          git clean -fd

      - name: Rebuild y reinicio del contenedor
        working-directory: /home/dev/proyects
        run: |
          docker-compose stop backend-spring-api
          docker-compose rm -f backend-spring-api
          docker-compose build --no-cache backend-spring-api
          docker-compose up -d --no-deps backend-spring-api
