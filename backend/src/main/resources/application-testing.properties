# Perfil de pruebas para conectividad Angular sin base de datos
# Puerto del servidor - CRÍTICO para Angular
server.port=3000

# Configuración temporal sin base de datos
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# JWT Configuration
security.jwt.key.private=${JWT_PRIVATE_KEY:mySecretKey}
security.jwt.user.generator=${JWT_USER_GENERATOR:AUTH0JWT-BACKEND}
jwt.expiration=86400000

# CORS Configuration - CRÍTICO para Angular
cors.allowed-origins=http://localhost:4200,http://localhost:80
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Logging
logging.level.org.springframework=INFO
logging.level.com.uis.schedule=DEBUG