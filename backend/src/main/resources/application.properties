spring.application.name=uis-schedule-system-backend

# Active profile (dev for local, prod for Docker)
spring.profiles.active=${SPRING_PROFILE}

#Database Config - Default uses localhost (override with profiles)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway migration settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

#Security Config
spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_USER_PASSWORD}

security.jwt.key.private=${JWT_PRIVATE_KEY}
security.jwt.user.generator=${JWT_USER_GENERATOR}
security.jwt.access-token.expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
security.jwt.refresh-token.expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Swagger / Springdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.persist-authorization=true

# Configuración SMTP para envío de correos (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Jackson date/time standardization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# URL base del frontend para construir el enlace de invitación
app.invitation.base-url=${INVITATION_BASE_URL}
# Horas de expiración del token (24 horas)
app.invitation.expiration-hours=24

# URL base del frontend para restablecer contraseña
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:4200/restablecer-contrasena}
# Horas de expiración del token de recuperación
app.password-reset.expiration-hours=2


