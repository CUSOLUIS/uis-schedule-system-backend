spring.application.name=uis-schedule-system-backend

# Active profile - CAMBIADO TEMPORALMENTE para testing Angular
spring.profiles.active=${SPRING_PROFILE:testing}

# Server Configuration - CAMBIO CRÍTICO: Puerto 3000 para el backend
server.port=3000
server.servlet.context-path=

# Database Config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduledb}
spring.datasource.username=${DB_USERNAME:schedule_user}
spring.datasource.password=${DB_PASSWORD:Ficolacho123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate - TEMPORALMENTE sin validación para testing
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
spring.security.user.name=${SECURITY_USER_NAME:admin}
spring.security.user.password=${SECURITY_USER_PASSWORD:admin123}

# JWT Configuration
security.jwt.key.private=${JWT_PRIVATE_KEY:mySecretKey}
security.jwt.user.generator=${JWT_USER_GENERATOR:AUTH0JWT-BACKEND}
jwt.expiration=86400000

# CORS Configuration - CRÍTICO para Angular
cors.allowed-origins=http://localhost:4200,http://localhost:80
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Development Logging
logging.level.org.springframework=INFO
logging.level.com.uis.schedule=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000



