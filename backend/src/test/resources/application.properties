spring.application.name=uis-schedule-system-backend

# Base de datos en memoria (H2) solo para tests, no requiere Postgres real
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate genera el esquema directamente (las migraciones de Flyway usan sintaxis de Postgres)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway desactivado en tests: las migraciones (SERIAL, JSONB, gen_random_uuid, etc.) son específicas de Postgres
spring.flyway.enabled=false

#Security Config (valores dummy, solo para que el contexto levante en test)
spring.security.user.name=test-admin
spring.security.user.password=test-password

security.jwt.key.private=test-secret-key-please-change-in-real-envs-0123456789
security.jwt.user.generator=test-generator
security.jwt.access-token.expiration-ms=900000
security.jwt.refresh-token.expiration-ms=604800000

# Swagger / Springdoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.persist-authorization=true

# Correo (dummy, no se envía nada real en tests)
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.invitation.base-url=http://localhost:4200/invitacion
app.invitation.expiration-hours=24

app.password-reset.base-url=http://localhost:4200/restablecer-contrasena
app.password-reset.expiration-hours=2
