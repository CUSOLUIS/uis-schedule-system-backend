version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: scheduleDB
      POSTGRES_USER: cusolOficial
      POSTGRES_PASSWORD: A4352k#_M
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spring-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cusolOficial -d scheduleDB" ]
      interval: 10s
      timeout: 5s
      retries: 5


  spring-api-image:
    image: spring-api-image
    container_name: spring-api-container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - spring-network

    depends_on:
      postgres:
        condition: service_healthy

networks:
  spring-network:

volumes:
  postgres-data: